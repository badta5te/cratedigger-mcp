name: Release

# Pushing a version tag such as v0.1.0 builds the package and publishes it to PyPI through
# Trusted Publishing: the publish job proves its identity with a short-lived OIDC token, so no
# PyPI token is stored anywhere. Actions are pinned to commits because the publish job can
# mint that token.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Check that the tag, pyproject.toml and server.json name one version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(uv version --short)"
          registry="$(jq -r '.version' server.json)"
          registry_package="$(jq -r '.packages[0].version' server.json)"
          echo "tag=$tag pyproject=$package server.json=$registry packages[0]=$registry_package"
          test "$tag" = "$package" && test "$tag" = "$registry" && test "$tag" = "$registry_package"
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Lint, type-check and test
        run: just check
      - name: Build the sdist and the wheel
        run: uv build --no-sources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cratedigger-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Publish through Trusted Publishing
        run: uv publish --trusted-publishing always dist/*
